name: europa_crm_fullstack

services:
  postgres:
    image: postgres:16-alpine
    container_name: europa-crm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: europa_user
      POSTGRES_PASSWORD: europa_password
      POSTGRES_DB: europa_crm
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - europa_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U europa -d europa_crm"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  europa_postgres_data:
    name: europa_crm_fullstack_europa_postgres_data
